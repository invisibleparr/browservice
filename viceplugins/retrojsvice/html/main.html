<html>
<head>
<title>%-programName-%</title>
<meta http-equiv="imagetoolbar" content="no">
<style>
body {
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
}
img {
    position: absolute;
    top: 0px;
    left: 0px;
    touch-action: none;
    -webkit-user-drag: none;
}
iframe {
    display: none;
    position: absolute;
    z-index: 1;
}
/* Hidden text input elements (backspace capture hack and virtual keyboard).
   They are kept inside the viewport but underneath the image element (which
   has a higher z-index) so that they remain invisible. Note that they must not
   be positioned outside the viewport: mobile browsers may refuse to show the
   on-screen keyboard for off-screen elements, or scroll/zoom the page to bring
   them into view. The font size is kept at 16px to prevent iOS from zooming
   the page when the element gains focus. */
textarea, input {
    position: absolute;
    z-index: 1;
    left: 0px;
    top: 0px;
    width: 2px;
    height: 2px;
    padding: 0px;
    border-width: 0px;
    font-size: 16px;
    -webkit-user-select: text;
}
.handCursor {
    cursor: pointer;
    cursor: hand;
}
.normalCursor {
    cursor: default;
}
.textCursor {
    cursor: text;
}
</style>
<script type="text/javascript">

// Configuration constants
var imgLoadRetryInterval = 3000;
var imgLoadMaxRetries = 10;
var minIframeLoadInterval = 2000;
var eventDelay = 10;

// Browser quirks
var useOnDOMMouseScroll = false;
var useOnMouseWheel = false;
var fixMousePosition = false;
var leftMouseButtonIs1 = false;
var bodyOverflowHiddenNotSupported = false;
var useBackspaceCaptureHack = false;
var isTouchDevice = false;

function detectBrowserQuirks() {
    var ua = window.navigator.userAgent.toLowerCase();
    if(ua.indexOf("chrome") != -1 || ua.indexOf("chromium") != -1) {
        useOnMouseWheel = true;
    }
    if(ua.indexOf("firefox") != -1) {
        useOnDOMMouseScroll = true;
    }
    if(ua.indexOf("classilla") != -1) {
        bodyOverflowHiddenNotSupported = true;
    }
    var msie = ua.indexOf("msie ");
    if(msie > 0) {
        var ver = parseInt(ua.substring(msie + 5, ua.indexOf(".", msie)), 10);
        var win16Bit =
            ua.indexOf("windows 3.1") != -1 ||
            ua.indexOf("win16") != -1 ||
            ua.indexOf("windows 16-bit") != -1;
        useOnMouseWheel = true;
        if(ver <= 8) {
            fixMousePosition = true;
            leftMouseButtonIs1 = true;
        }
        if(ver <= 4 || (ver == 5 && win16Bit)) {
            bodyOverflowHiddenNotSupported = true;
            useBackspaceCaptureHack = true;
        }
    }

    // Touch input and virtual keyboard support is only enabled on devices with
    // touch capability. This keeps the behavior of old non-touch client
    // browsers completely unchanged.
    isTouchDevice =
        ('ontouchstart' in window) || ((navigator.maxTouchPoints | 0) > 0);

    // Some iOS app browsers (UIWebView-based shells, e.g. on old iPod touches)
    // report a mobile UA but expose no touch events at all, only synthetic
    // mouse events. Treat them as touch devices too so that they get the
    // virtual keyboard and the touch-mode control bar; their input keeps
    // flowing through the regular mouse event path (the touch-event-based
    // suppression of synthetic mouse events never triggers for them).
    if(
        !isTouchDevice &&
        (ua.indexOf("iphone") != -1 || ua.indexOf("ipad") != -1 ||
         ua.indexOf("ipod") != -1)
    ) {
        isTouchDevice = true;
    }

    // Old iOS WebKit (< 600, e.g. iOS 4 era) never shows the on-screen
    // keyboard for programmatic focus(), not even from within a user gesture
    // handler; the keyboard only appears when a tap lands directly on an
    // editable element. Such clients need the tap overlay (see
    // kbOverlayMode_). Modern iOS Safari and Android browsers do not, and
    // the overlay would interfere with normal touch input there. Note that
    // Android Chrome also reports an old AppleWebKit version, but its UA
    // does not contain "Mac OS X".
    if(isTouchDevice) {
        var webkitMatch = navigator.userAgent.match(/AppleWebKit\/([0-9]+)/);
        kbNeedsTapOverlay = (
            webkitMatch != null &&
            ua.indexOf("mac os x") != -1 &&
            parseInt(webkitMatch[1], 10) < 600
        );
    }

}

// State variables
var shutdown = false;

var eventQueue = new Array();
var eventQueueStartIdx = 0;

var mouseMoved = false;
var mouseX = 0;
var mouseY = 0;

// Touch input and virtual keyboard state (only used on touch devices)

// Set for old iOS WebKit builds that need a direct tap on an editable element
// to show the on-screen keyboard (see detectBrowserQuirks, kbOverlayMode_).
var kbNeedsTapOverlay = false;
var pendingTouchMoves = {};
var kbdTextarea = null;
var kbdInput = null;
var kbdState = 0; // 0=none, 1=text, 2=numeric (derived from image height signal)
var lastKbValue = "";

// Debounced application of the keyboard signal state.
var kbdStatePending = 0;
var kbdStateDebounceTimeout = null;

function applyKbdState() {
    kbdStateDebounceTimeout = null;
    if(kbdState == kbdStatePending) return;
    kbdState = kbdStatePending;
    updateKeyboardFocus();
}

// Timestamp of the most recent touch event. Used to suppress the synthetic
// mouse events that browsers generate for touches (which would otherwise be
// sent as duplicate input).
var lastTouchTime = 0;

function recentTouchEvent() {
    return isTouchDevice && new Date().getTime() - lastTouchTime < 1000;
}

// Iframe loading system
var nextAllowedIframeLoadTime = new Date().getTime();
var nextIframeLoadIdx = 1;
var schedIframeLoadIdx = null;
var iframeLoadTimeout = null;
var iframeElemIdx = 0;

function iframeLoadHandler(iframeLoadIdx) {
    if(shutdown || iframeLoadIdx != schedIframeLoadIdx) return;

    schedIframeLoadIdx = null;

    nextAllowedIframeLoadTime = new Date().getTime() + minIframeLoadInterval;

    ++iframeElemIdx;
    if(iframeElemIdx >= document.forms.length - 1) {
        iframeElemIdx = 0;
    }

    var rand = (1e9 * Math.random()) | 0;
    document.forms[iframeElemIdx].innerHTML =
        "<iframe src=\"%-pathPrefix-%/iframe/%-mainIdx-%/" + rand + "/\"></iframe>";
}

function loadIframe() {
    if(shutdown || schedIframeLoadIdx != null) return;

    schedIframeLoadIdx = nextIframeLoadIdx++;
    iframeLoadTimeout = setTimeout(
        "iframeLoadHandler(" + schedIframeLoadIdx + ")",
        Math.max(nextAllowedIframeLoadTime - new Date().getTime(), 0)
    );
}

function cancelIframeLoad() {
    if(shutdown || schedIframeLoadIdx == null) return;

    schedIframeLoadIdx = null;
    clearTimeout(iframeLoadTimeout);
}

// Image loading loop
var imgElems = new Array();
var imgElemClass = new Array();
imgElemClass[0] = null;
imgElemClass[1] = null;

var currentImgLoadIdx = 0;
var imgReqIdx = 0;
var imgLoadEventIncrement;
var firstImgReqSent;
var imgLoadAttempts;
var currentImgReloadIdx;
var allowNewEventNotify;
var postImgLoadHandlerSchedIdx = null;
var imgReloadTimeout = null;

function scheduleImgReload(imgLoadIdx, delay) {
    if(shutdown || imgLoadIdx != currentImgLoadIdx) return;

    if(imgReloadTimeout) {
        clearTimeout(imgReloadTimeout);
        imgReloadTimeout = null;
    }

    var imgReloadIdx = ++currentImgReloadIdx;
    setTimeout(
        "imgReloadTimeoutComplete(" + imgLoadIdx + ", " + imgReloadIdx + ")",
        delay
    );
}

function newEventNotify() {
    if(shutdown || currentImgLoadIdx == 0 || !allowNewEventNotify) return;
    allowNewEventNotify = false;

    imgLoadAttempts = Math.max(imgLoadAttempts - 1, 0);

    scheduleImgReload(currentImgLoadIdx, eventDelay);
}

function sendImgReq(imgLoadIdx) {
    if(shutdown || imgLoadIdx != currentImgLoadIdx) return;

    if(imgLoadAttempts > imgLoadMaxRetries) {
        document.title = "%-programName-%: Connection lost";
        window.status = "%-programName-%: Connection lost";
        shutdown = true;
        return;
    }
    ++imgLoadAttempts;

    if(mouseMoved) {
        eventQueue[eventQueue.length] = "MMO_" + mouseX + "_" + mouseY;
        mouseMoved = false;
    }

    for(var touchId in pendingTouchMoves) {
        if(pendingTouchMoves.hasOwnProperty(touchId)) {
            eventQueue[eventQueue.length] =
                "TMO_" + touchId + "_" +
                pendingTouchMoves[touchId][0] + "_" +
                pendingTouchMoves[touchId][1];
        }
    }
    pendingTouchMoves = {};

    var width = document.body.clientWidth | 0;
    var height = document.body.clientHeight | 0;
    if(width == 0 || height == 0) {
        width = window.innerWidth | 0;
        height = window.innerHeight | 0;
    }
    if(bodyOverflowHiddenNotSupported) {
        width -= 1;
        height -= 2;
    }
    width = Math.max(width, 1);
    height = Math.max(height, 1);

    var immediate = ((firstImgReqSent || imgReqIdx == 0) ? 1 : 0);
    firstImgReqSent = true;

    var imgPath =
        "%-pathPrefix-%/image/" +
        "%-mainIdx-%/" +
        (++imgReqIdx) + "/" +
        immediate + "/" +
        width + "/" +
        height + "/" +
        eventQueueStartIdx + "/";
    for(var i = 0; i < eventQueue.length; ++i) {
        imgPath += eventQueue[i] + "/";
    }
    imgElems[imgLoadIdx & 1].src = imgPath;

    scheduleImgReload(imgLoadIdx, imgLoadRetryInterval);
}

function imgReloadTimeoutComplete(imgLoadIdx, imgReloadIdx) {
    if(
        shutdown ||
        imgLoadIdx != currentImgLoadIdx ||
        imgReloadIdx != currentImgReloadIdx
    ) return;

    imgReloadTimeout = null;
    sendImgReq(imgLoadIdx);
}

function startImgLoad() {
    if(shutdown) return;

    var imgLoadIdx = ++currentImgLoadIdx;

    imgLoadEventIncrement = eventQueue.length;
    firstImgReqSent = false;
    imgLoadAttempts = 0;
    currentImgReloadIdx = 0;
    allowNewEventNotify = true;

    sendImgReq(imgLoadIdx);
}

function updateCursor(imgElemIdx) {
    if(shutdown) return;

    var cursor = imgElems[imgElemIdx].height % 3;
    if(cursor == 0) {
        var newClassName = "handCursor";
    } else if(cursor == 1) {
        var newClassName = "normalCursor";
    } else {
        var newClassName = "textCursor";
    }

    if(newClassName != imgElemClass[imgElemIdx]) {
        imgElemClass[imgElemIdx] = newClassName;
        imgElems[imgElemIdx].className = newClassName;
    }

    // The virtual keyboard input mode signal is encoded in the image height as
    // floor((height % 9) / 3). Changes are debounced briefly to avoid flickering
    // the on-screen keyboard when the remote focus state changes rapidly.
    if(isTouchDevice) {
        var newKbdState = Math.floor((imgElems[imgElemIdx].height % 9) / 3);
        if(newKbdState != kbdStatePending) {
            kbdStatePending = newKbdState;
            if(kbdStateDebounceTimeout != null) {
                clearTimeout(kbdStateDebounceTimeout);
            }
            kbdStateDebounceTimeout = setTimeout(applyKbdState, 250);
        }
    }
}

function postImgLoadHandler(imgLoadIdx) {
    if(shutdown || imgLoadIdx != postImgLoadHandlerSchedIdx) return;

    postImgLoadHandlerSchedIdx = null;

    if(imgLoadIdx >= 3) {
        if(imgElems[imgLoadIdx & 1].width % 2 == 0) {
            loadIframe();
        } else {
            cancelIframeLoad();
        }
    }

    updateCursor(imgLoadIdx & 1);
}

function imgLoadHandler(imgElemIdx) {
    if(shutdown || (currentImgLoadIdx & 1) != imgElemIdx) return;

    allowNewEventNotify = false;

    ++currentImgReloadIdx;
    if(imgReloadTimeout) {
        clearTimeout(imgReloadTimeout);
        imgReloadTimeout = null;
    }

    eventQueueStartIdx += imgLoadEventIncrement;
    var oldEventQueue = eventQueue;
    eventQueue = new Array();
    for(var i = imgLoadEventIncrement; i < oldEventQueue.length; ++i) {
        eventQueue[i - imgLoadEventIncrement] = oldEventQueue[i];
    }

    if(postImgLoadHandlerSchedIdx != null) {
        postImgLoadHandler(postImgLoadHandlerSchedIdx);
    }

    updateCursor(currentImgLoadIdx & 1);

    imgElems[currentImgLoadIdx & 1].style.zIndex = 3;
    imgElems[(currentImgLoadIdx & 1) ^ 1].style.zIndex = 2;

    postImgLoadHandlerSchedIdx = currentImgLoadIdx;
    setTimeout("postImgLoadHandler(" + currentImgLoadIdx + ")", 0);

    startImgLoad();
}

// Virtual keyboard support for touch devices. A hidden textarea/input element
// is focused when a text field gains focus in the remote browser, causing the
// client device to show its on-screen keyboard. Key presses are forwarded as
// regular key events; character input (including autocorrect and composition)
// is detected by diffing the value of the element on input events.

function kbActiveElement() {
    return kbdState == 2 ? kbdInput : kbdTextarea;
}

function keyboardHasFocus() {
    if(!isTouchDevice) return false;
    var ae = document.activeElement;
    return ae === kbdTextarea || ae === kbdInput;
}

// Filler content seeded into the keyboard buffer while a remote text field is
// focused. Some mobile browsers (e.g. Android Chrome with Gboard) report no
// usable key information for backspace presses (keyCode 229 / key 'Unidentified')
// and fire no input event when the local buffer is empty, so an empty buffer
// gives no signal that a deletion was requested. By seeding invisible-to-the-
// user filler characters, every backspace press deletes something locally,
// which produces an input event whose diff results in exactly one remote
// backspace. The filler itself is never sent to the server (it is part of the
// baseline value).
var kbFiller = new Array(513).join(" ");

// Set to true once a keydown event is observed that carries no usable key
// information (keyCode 229 / key 'Unidentified', as reported by Android soft
// keyboards for every key press). Only then is the deletion filler used; on
// browsers with proper key codes (e.g. iOS) the buffer stays empty and
// backspaces are detected directly from the keydown event instead, which
// avoids interfering with those browsers' text input behavior.
var kbUnreliableKeydown = false;

function resetKeyboardBuffer() {
    var baseline = kbUnreliableKeydown ? kbFiller : "";
    lastKbValue = baseline;
    try {
        kbdTextarea.value = baseline;
        kbdInput.value = baseline;
    } catch(e) {}
    // Place the caret at the end so that typing appends after the filler and
    // backspace deletes from it.
    var elems = [kbdTextarea, kbdInput];
    for(var i = 0; i < elems.length; ++i) {
        try {
            elems[i].selectionStart = kbFiller.length;
            elems[i].selectionEnd = kbFiller.length;
        } catch(e) {}
    }
}

// True after focusKeyboard_() has focused the element outside a user gesture;
// such a focus attempt may have been ignored by the browser for the purpose of
// showing the on-screen keyboard, so allow one blur/focus cycle from within the
// next gesture handler to recover. Cleared once a gesture-based focus is done.
var kbAsyncFocusPending = false;

function focusKeyboard_() {
    // Note that some mobile browsers ignore programmatic focus() calls outside
    // user gesture handlers; this function is therefore also called from the
    // touchstart handler so that the keyboard can be brought back by tapping.
    var elem = kbActiveElement();
    if(elem != null && document.activeElement !== elem) {
        try {
            elem.focus();
            // Some browsers select all content on focus, which would make the
            // next typed character replace the filler (sending a flood of
            // deletions). Keep the caret at the end instead.
            try {
                elem.selectionStart = elem.value.length;
                elem.selectionEnd = elem.value.length;
            } catch(e) {}
            kbAsyncFocusPending = true;
            // Undo any page scrolling that focusing the off-screen element may
            // have triggered (some mobile browsers do this despite overflow
            // hidden).
            window.scrollTo(0, 0);
        } catch(e) {}
    }
}

// Some shells (e.g. UIWebView-based app browsers on old iOS) only show the
// soft keyboard when a tap lands directly on an editable element, and never
// for programmatic focus(). While a remote field has focus, stretch the active
// keyboard element transparently over the whole viewport so that the next tap
// physically hits it (bringing up the keyboard natively). Mouse events still
// bubble to our document-level handlers with correct coordinates, so input
// keeps flowing to the remote page.
function kbOverlayMode_(active) {
    if(!kbNeedsTapOverlay) return;

    var elem = kbActiveElement();
    var other = (elem === kbdTextarea) ? kbdInput : kbdTextarea;

    try { if(other != null) other.style.cssText = ""; } catch(e) {}
    if(elem == null) return;

    if(active && kbdState != 0) {
        elem.style.cssText =
            "position:absolute;top:0;left:0;width:100%;height:100%;" +
            "z-index:40;margin:0;padding:0;border-width:0;" +
            "background:transparent;color:transparent;font-size:16px;";
    } else {
        elem.style.cssText = "";
    }
}

function updateKeyboardFocus() {
    if(!isTouchDevice || kbdTextarea == null) return;

    resetKeyboardBuffer();

    if(kbdState == 0) {
        kbAsyncFocusPending = false;
        var ae = document.activeElement;
        if(ae === kbdTextarea || ae === kbdInput) {
            try { ae.blur(); } catch(e) {}
        }
    } else {
        focusKeyboard_();
    }

    kbOverlayMode_(kbdState != 0);
}

function kbKeydownHandler(event) {
    if(!event) event = window.event;
    var key = event.keyCode | 0;

    var keyName = event.key != null ? event.key : "?";

    if(
        !kbUnreliableKeydown &&
        (key == 0 || key == 229 || keyName == "Unidentified")
    ) {
        // This browser does not report usable keys: switch to the filler
        // scheme. Append the filler while preserving any content typed so far
        // and extend the baseline accordingly, so nothing is sent to the
        // server by this change.
        kbUnreliableKeydown = true;
        try {
            kbdTextarea.value += kbFiller;
            kbdInput.value += kbFiller;
            lastKbValue += kbFiller;
        } catch(e) {}
    }

    // Refill the deletion filler before the key takes effect (the input event
    // handler may not run for deletions of trailing whitespace). Appending now
    // means a backspace simply deletes one of the new filler characters, which
    // then produces a regular diff.
    if(
        kbUnreliableKeydown &&
        event.target != null &&
        typeof event.target.value === "string" &&
        event.target.value.length < 16
    ) {
        try {
            event.target.value += kbFiller;
            lastKbValue += kbFiller;
            event.target.selectionStart = event.target.value.length;
            event.target.selectionEnd = event.target.value.length;
        } catch(e) {}
    }
    // Special keys are sent directly. Character input and deletions (including
    // autocorrect updates) arrive via the input event instead.
    if(key == 9 || key == 13 || key == 27 || (key >= 35 && key <= 40)) {
        putEvent("KDN_" + encodeKey(key));
        putEvent("KUP_" + encodeKey(key));
        preventDefault(event);
    } else if(
        (key == 8 || keyName == "Backspace") &&
        event.target != null &&
        event.target.value === ""
    ) {
        // Backspace with an empty local buffer: there is nothing to delete
        // locally and no input event will fire, but the remote text field may
        // still have content (which we cannot read), so send a backspace.
        putEvent("KDN_" + encodeKey(8));
        putEvent("KUP_" + encodeKey(8));
    }
}

function kbInputHandler(elem, event) {
    // Ignore intermediate composition updates; the final result is handled on
    // the compositionend event.
    if(event && event.isComposing) return;

    var newVal = elem.value;
    var oldVal = lastKbValue;

    // Compute the common prefix and suffix of the old and new values to detect
    // deletions and insertions around the caret. Deletions are sent as
    // backspaces and insertions as key presses, which mirrors how the edits
    // happened relative to the caret in the remote text field.
    var p = 0;
    while(
        p < oldVal.length && p < newVal.length &&
        oldVal.charAt(p) == newVal.charAt(p)
    ) ++p;

    var s = 0;
    while(
        s < oldVal.length - p && s < newVal.length - p &&
        oldVal.charAt(oldVal.length - 1 - s) == newVal.charAt(newVal.length - 1 - s)
    ) ++s;

    for(var i = 0; i < oldVal.length - p - s; ++i) {
        putEvent("KDN_" + encodeKey(8));
        putEvent("KUP_" + encodeKey(8));
    }

    var end = newVal.length - s;
    var j = p;
    while(j < end) {
        var code = newVal.charCodeAt(j);
        if(
            code >= 0xD800 && code <= 0xDBFF && j + 1 < end &&
            newVal.charCodeAt(j + 1) >= 0xDC00 && newVal.charCodeAt(j + 1) <= 0xDFFF
        ) {
            putEvent("KPR_" + encodeKey(
                0x10000 + (code - 0xD800) * 0x400 + (newVal.charCodeAt(j + 1) - 0xDC00)
            ));
            j += 2;
        } else {
            putEvent("KPR_" + encodeKey(code));
            ++j;
        }
    }

    lastKbValue = newVal;

    // Keep the deletion filler from running dry (each backspace consumes one
    // filler character). The appended filler becomes part of the baseline, so
    // it is never sent to the server.
    if(kbUnreliableKeydown && elem.value.length < 16) {
        try {
            elem.value += kbFiller;
        } catch(e) {}
        lastKbValue = elem.value;
    }
}

function registerKeyboardHandlers() {
    kbdTextarea = document.getElementById("kbTextarea");
    kbdInput = document.getElementById("kbInput");
    if(kbdTextarea == null || kbdInput == null) return;

    // Use a dedicated input element for numeric fields so that mobile browsers
    // show the appropriate key layout. The decimal input mode is used as it is
    // a superset of the plain numeric layout (allowing also e.g. the minus
    // sign and decimal separator).
    try {
        kbdInput.setAttribute("inputmode", "decimal");
    } catch(e) {}

    var elems = [kbdTextarea, kbdInput];
    for(var i = 0; i < elems.length; ++i) {
        (function(elem) {
            elem.onkeydown = kbKeydownHandler;
            elem.addEventListener(
                "input",
                function(event) { kbInputHandler(elem, event); },
                false
            );
            elem.addEventListener(
                "compositionend",
                function() { kbInputHandler(elem, null); },
                false
            );
        })(elems[i]);
    }
}

// iOS Safari uses arbitrary large integers as touch identifiers, while the
// server protocol requires identifiers in the range 0..15. Map each active
// client-side identifier to a free slot for the duration of its touch.
var touchIdSlots = {};
var touchSlotUsed = new Array(16);
for(var i = 0; i < 16; ++i) { touchSlotUsed[i] = false; }

function mapTouchId(rawId) {
    var key = "" + rawId;
    if(touchIdSlots.hasOwnProperty(key)) { return touchIdSlots[key]; }
    for(var slot = 0; slot < 16; ++slot) {
        if(!touchSlotUsed[slot]) {
            touchSlotUsed[slot] = true;
            touchIdSlots[key] = slot;
            return slot;
        }
    }
    return 0;
}

function releaseTouchId(rawId) {
    var key = "" + rawId;
    if(touchIdSlots.hasOwnProperty(key)) {
        touchSlotUsed[touchIdSlots[key]] = false;
        delete touchIdSlots[key];
    }
}

// Touch input support for touch devices. Touch events are sent to the server
// as raw touch events (TDN/TMO/TUP/TCA tokens) which the remote browser engine
// interprets natively (including gesture recognition such as tap-to-click and
// swipe scrolling). The default behavior of the client page itself (scrolling,
// zooming, synthetic mouse events) is suppressed.

// Attempts to (re-)open the on-screen keyboard by focusing our hidden element.
// Must be called synchronously from a user gesture handler, since mobile
// browsers may ignore focus() calls made outside a gesture even though the
// element becomes focused; in that case a plain focus() call would also be a
// no-op later on (the element already has focus), so force a blur/focus cycle
// to make sure the browser sees a fresh focus event. To avoid flickering an
// already visible keyboard, the cycle is only done when the element does not
// have focus or when the last focus attempt was made outside a gesture (and
// may thus have been ignored for keyboard purposes).
function refocusKeyboardInGesture_() {
    if(kbdState == 0) return;

    var kbElem = kbActiveElement();
    if(kbElem == null) return;

    if(document.activeElement === kbElem && !kbAsyncFocusPending) {
        // Assume the keyboard is already visible.
        return;
    }

    try { kbElem.blur(); } catch(e) {}
    try {
        kbElem.focus();
        try {
            kbElem.selectionStart = kbElem.value.length;
            kbElem.selectionEnd = kbElem.value.length;
        } catch(e2) {}
        window.scrollTo(0, 0);
    } catch(e) {}
    kbAsyncFocusPending = false;
}

function registerTouchHandlers() {
    var options = {passive: false};

    // Note that touchstart and touchend must not be canceled with
    // preventDefault(): doing so suppresses the user activation needed for
    // showing the on-screen keyboard (and prevents click events entirely on
    // iOS, where focus() only works from a click handler). The default page
    // scrolling/zooming behavior is instead suppressed with touch-action: none
    // in CSS, and the synthetic mouse events generated for touches are ignored
    // via the recentTouchEvent() check in the mouse event handlers.
    document.addEventListener("touchstart", function(event) {
        lastTouchTime = new Date().getTime();

        // Some mobile browsers honor focus() from touchstart (earlier than
        // from the click handler). Note that this must not preventDefault().
        refocusKeyboardInGesture_();

        var touches = event.changedTouches;
        for(var i = 0; i < touches.length; ++i) {
            putEvent(
                "TDN_" + mapTouchId(touches[i].identifier) + "_" +
                (touches[i].clientX | 0) + "_" + (touches[i].clientY | 0)
            );
        }
    }, options);

    document.addEventListener("touchmove", function(event) {
        lastTouchTime = new Date().getTime();
        preventDefault(event);

        var touches = event.changedTouches;
        for(var i = 0; i < touches.length; ++i) {
            pendingTouchMoves[mapTouchId(touches[i].identifier)] = [
                touches[i].clientX | 0, touches[i].clientY | 0
            ];
        }
        newEventNotify();
    }, options);

    document.addEventListener("touchend", function(event) {
        lastTouchTime = new Date().getTime();

        var touches = event.changedTouches;
        for(var i = 0; i < touches.length; ++i) {
            var id = mapTouchId(touches[i].identifier);
            delete pendingTouchMoves[id];
            releaseTouchId(touches[i].identifier);
            putEvent(
                "TUP_" + id + "_" +
                (touches[i].clientX | 0) + "_" + (touches[i].clientY | 0)
            );
        }
    }, options);

    document.addEventListener("touchcancel", function(event) {
        lastTouchTime = new Date().getTime();

        var touches = event.changedTouches;
        for(var i = 0; i < touches.length; ++i) {
            var id = mapTouchId(touches[i].identifier);
            delete pendingTouchMoves[id];
            releaseTouchId(touches[i].identifier);
            putEvent(
                "TCA_" + id + "_" +
                (touches[i].clientX | 0) + "_" + (touches[i].clientY | 0)

        }
    }, options);

    // iOS only allows showing the on-screen keyboard from a click event
    // handler, so also attempt to focus our hidden element there.
    document.addEventListener("click", function(event) {
        refocusKeyboardInGesture_();
    }, false);
}

// Event handling
var shiftDown = false;
var controlDown = false;
var altDown = false;

var nonCharKeyList = new Array(%-nonCharKeyList-%);
var nonCharKeys = {};
for(var i = 0; i < nonCharKeyList.length; ++i) {
    nonCharKeys[nonCharKeyList[i]] = true;
}

var hackForm;
var hackInput;

var snakeOilKeyCipherKey = new Array();
function pushSnakeOil(a) {
    for(var i = 0; i < a.length; ++i) {
        snakeOilKeyCipherKey[snakeOilKeyCipherKey.length] = a[i];
    }
}
%-snakeOilKeyCipherKeyWrites-%

function encodeKey(key) {
    var i = eventQueueStartIdx + eventQueue.length;
    return key ^ snakeOilKeyCipherKey[i % snakeOilKeyCipherKey.length];
}

function putEvent(event) {
    eventQueue[eventQueue.length] = event;
    newEventNotify();
}

function updateMousePos(event) {
    mouseX = event.clientX | 0;
    mouseY = event.clientY | 0;
    if(fixMousePosition) {
        mouseX -= 2;
        mouseY -= 2;
    }
}

function preventDefault(event) {
    if(event.preventDefault) {
        event.preventDefault();
    } else {
        event.returnValue = false;
    }
}

function sanitizeModifiers(event, func) {
    if(
        event.shiftKey === false &&
        event.ctrlKey === false &&
        event.altKey === false
    ) {
        if(shiftDown) putEvent("KUP_" + encodeKey(16));
        if(controlDown) putEvent("KUP_" + encodeKey(17));
        if(altDown) putEvent("KUP_" + encodeKey(18));
        shiftDown = false;
        controlDown = false;
        altDown = false;
    }

    var tmpShift = !shiftDown && event.shiftKey === true;
    var tmpControl = !controlDown && event.ctrlKey === true;
    if(tmpShift) putEvent("KDN_" + encodeKey(16));
    if(tmpControl) putEvent("KDN_" + encodeKey(17));

    func();

    if(tmpControl) putEvent("KUP_" + encodeKey(17));
    if(tmpShift) putEvent("KUP_" + encodeKey(16));
}

function registerEventHandlers() {
    imgElems[0].onload = function() { imgLoadHandler(0); };
    imgElems[1].onload = function() { imgLoadHandler(1); };

    window.onresize = newEventNotify;

    document.onmousedown = function(event) {
        if(!event) event = window.event;
        if(recentTouchEvent()) { preventDefault(event); return; }
        updateMousePos(event);
        var button = event.button | 0;
        if(button >= 0 && button <= 2) {
            if(leftMouseButtonIs1 && button == 1) {
                button = 0;
            }
            sanitizeModifiers(event, function() {
                putEvent("MDN_" + mouseX + "_" + mouseY + "_" + button);
            });
        }
        window.focus();
        preventDefault(event);
    };

    document.onmouseup = function(event) {
        if(!event) event = window.event;
        if(recentTouchEvent()) { preventDefault(event); return; }
        updateMousePos(event);
        var button = event.button | 0;
        if(button >= 0 && button <= 2) {
            if(leftMouseButtonIs1 && button == 1) {
                button = 0;
            }
            putEvent("MUP_" + mouseX + "_" + mouseY + "_" + button);
        }
        preventDefault(event);
    };

    document.ondblclick = function(event) {
        if(!event) event = window.event;
        if(recentTouchEvent()) { preventDefault(event); return; }
        updateMousePos(event);
        putEvent("MDBL_" + mouseX + "_" + mouseY);
        preventDefault(event);
    };

    document.onmousemove = function(event) {
        if(!event) event = window.event;
        if(recentTouchEvent()) return;
        updateMousePos(event);
        if(!mouseMoved) {
            mouseMoved = true;
            newEventNotify();
        }
    };

    if(useOnDOMMouseScroll) {
        document.addEventListener(
            "DOMMouseScroll",
            function(event) {
                if(recentTouchEvent()) { event.preventDefault(); return; }
                var delta = -120 * (event.detail | 0);
                putEvent("MWH_" + mouseX + "_" + mouseY + "_" + delta);
                event.preventDefault();
            },
            false
        );
    } else if(useOnMouseWheel) {
        document.onmousewheel = function(event) {
            if(!event) event = window.event;
            if(recentTouchEvent()) return;
            putEvent("MWH_" + mouseX + "_" + mouseY + "_" + (event.wheelDelta | 0));
        };
    } else {
        document.onwheel = function(event) {
            if(recentTouchEvent()) return;
            var delta = 0;
            if(event.deltaY > 0) delta = -120;
            if(event.deltaY < 0) delta = 120;
            putEvent("MWH_" + mouseX + "_" + mouseY + "_" + delta);
        };
    }

    document.body.onmouseleave = function() {
        if(recentTouchEvent()) return;
        putEvent("MOUT_" + mouseX + "_" + mouseY);
    };

    if(useBackspaceCaptureHack) {
        hackForm = document.forms[document.forms.length - 1];
        hackInput = hackForm.elements[0];

        hackForm.onsubmit = function() {
            if(!event) event = window.event;
            preventDefault(event);
        };

        window.onfocus = function() {
            setTimeout("hackInput.focus()", 0);
        };
    } else {
        document.forms[document.forms.length - 1].innerHTML = "";
        window.onblur = function() {
            putEvent("FOUT");
        };
    }

    document.ondragstart = function() {
        return false;
    };

    document.oncontextmenu = function(event) {
        if(!event) event = window.event;
        preventDefault(event);
    };

    if(isTouchDevice) {
        // Notify the server that this client uses touch input, so that it can
        // enlarge the control bar for touch operation. This event is sent as
        // part of the first image request, before any other events.
        putEvent("TCH_1");

        registerKeyboardHandlers();
        registerTouchHandlers();
    }

    document.onkeypress = function(event) {
        if(keyboardHasFocus()) return; // handled by the virtual keyboard element
        if(!event) {
            event = window.event;
            var key = event.keyCode | 0;
        } else {
            var key = event.which | 0;
        }
        if(
            key > 32 &&
            !(controlDown && ((key >= 65 && key <= 90) || (key >= 97 && key <= 122)))
        ) {
            sanitizeModifiers(event, function() {
                putEvent("KPR_" + encodeKey(key));
            });
        }
        preventDefault(event);
    };

    document.onkeydown = function(event) {
        if(keyboardHasFocus()) return; // handled by the virtual keyboard element
        if(!event) {
            event = window.event;
            var key = event.keyCode | 0;
        } else {
            var key = event.which | 0;
        }
        if(controlDown && key >= 65 && key <= 90) {
            putEvent("KPR_" + encodeKey(key + 32));
            preventDefault(event);
        } else if(nonCharKeys[key]) {
            if(key == 16) shiftDown = true;
            if(key == 17) controlDown = true;
            if(key == 18) altDown = true;

            sanitizeModifiers(event, function() {
                putEvent("KDN_" + encodeKey(key));
            });

            preventDefault(event);
        }
    };

    document.onkeyup = function(event) {
        if(keyboardHasFocus()) return; // handled by the virtual keyboard element
        if(!event) {
            event = window.event;
            var key = event.keyCode | 0;
        } else {
            var key = event.which | 0;
        }
        if(nonCharKeys[key]) {
            if(key == 16) shiftDown = false;
            if(key == 17 || key == 18) {
                controlDown = false;
                altDown = false;
                putEvent("KUP_" + encodeKey(17));
                putEvent("KUP_" + encodeKey(18));
            } else {
                putEvent("KUP_" + encodeKey(key));
            }
            preventDefault(event);
        }
    };

    window.onbeforeunload = function(event) {
        if(shutdown) return;

        shutdown = true;

        imgElems[0].src = "%-pathPrefix-%/close/%-mainIdx-%/";
        imgElems[1].src = "%-pathPrefix-%/close/%-mainIdx-%/";

        var start = new Date().getTime();
        while(new Date().getTime() - start < 50) {}
    };
}

// Entry point
window.onload = function() {
    detectBrowserQuirks();

    imgElems[0] = document.images[0];
    imgElems[1] = document.images[1];

    registerEventHandlers();

    startImgLoad();
};
